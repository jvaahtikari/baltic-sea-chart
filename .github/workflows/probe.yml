name: Probe seamark sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install osmium
        run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y -qq --no-install-recommends osmium-tool
      - name: Fetch OSM seamarks of Estonia and Latvia with the pipeline's own code (raw data for local tuning)
        timeout-minutes: 25
        run: |
          mkdir -p /tmp/p/raw/osm /tmp/pw
          BSC_WORK=/tmp/pw python3 - <<'PY' 2>&1 | tail -30 > /tmp/p/probe.md || true
          import pathlib, shutil
          from pipeline import config as C, fetch as F
          d = pathlib.Path("/tmp/p/raw/osm")
          for name, osmfr, geofabrik, box in C.OSM_REGIONS:
              if name not in ("estonia", "latvia"):
                  continue
              for how in ("extract", "overpass"):
                  try:
                      if how == "extract":
                          F.osm_region_from_extract(name, C.GEOFABRIK + geofabrik + "-latest.osm.pbf", d)
                      else:
                          F.osm_region_from_overpass(name, box, d)
                      print(name, how, "ok"); break
                  except Exception as e:
                      print(name, how, "failed", str(e)[:200])
          PY
          gzip -r /tmp/p/raw || true

      - name: Publish to branch probe-log
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d="$(mktemp -d)"; cp -r /tmp/p/. "$d/" || echo none > "$d/probe.md"
          cd "$d"; git init -q -b probe-log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe ${GITHUB_RUN_ID}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --force origin probe-log
