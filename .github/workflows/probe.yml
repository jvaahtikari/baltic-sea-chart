name: Probe seamark sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Probe
        run: mkdir -p /tmp/p && cd /tmp/p && bash "$GITHUB_WORKSPACE/.github/probe/sources.sh" /tmp/p/probe.md || true
      - name: Publish to branch probe-log
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d="$(mktemp -d)"; cp /tmp/p/probe.md "$d/probe.md" || echo none > "$d/probe.md"
          cd "$d"; git init -q -b probe-log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe ${GITHUB_RUN_ID}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --force origin probe-log
