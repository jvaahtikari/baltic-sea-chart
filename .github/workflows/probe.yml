name: Probe seamark sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y -qq --no-install-recommends osmium-tool gdal-bin python3-gdal python3-numpy python3-shapely python3-pyproj
      - name: Land test at the Gulf of Riga after the MultiPolygon fix (real land polygons)
        timeout-minutes: 25
        run: |
          mkdir -p /tmp/p /tmp/pw/raw/land /tmp/pw/raw/osm
          BSC_WORK=/tmp/pw python3 - <<'PY' > /tmp/p/probe.md 2>&1 || true
          import json, subprocess
          from pipeline import config as C, fetch as F
          d = C.RAW / "land"
          z = d / "land.zip"
          F.http_get(C.OSMDATA + "land-polygons-complete-4326.zip", z, timeout=1800)
          subprocess.run(["ogr2ogr", "-f", "GeoJSONSeq", "-overwrite", str(d / "land.geojsonl"),
                          "/vsizip/%s/land-polygons-complete-4326/land_polygons.shp" % z,
                          "-clipsrc", "20.5", "56.0", "25.0", "58.2", "-explodecollections", "-lco", "RS=NO"], check=True)
          from pipeline import build as B
          from shapely.geometry import shape, Point
          import shapely
          L = B.LandIndex()
          print("land polygons", len(L.land), "coast pieces", len(L.coast_tree.geometries))
          for name, lon, lat in (("Daugavgriva front beacon", 24.02175, 57.0600833), ("Daugavgriva lighthouse", 24.0237, 57.0597),
                                 ("Irbe", 21.7230417, 57.7507167), ("Kolka", 22.5917, 57.7566)):
              x, y = B._to_laea.transform(lon, lat)
              q = Point(x, y)
              hits = L.land_tree.query(q, predicate="intersects")
              print("##", name, "keep", L.keep(lon, lat), "in land polygons", list(hits))
              for i in hits:
                  g = L.land[int(i)]
                  print("  polygon", int(i), g.geom_type, "area km2 %.0f" % (g.area / 1e6), "rings", len(shapely.get_rings(g)),
                        "vertices", shapely.get_num_coordinates(g), "dist to boundary m %.0f" % g.boundary.distance(q),
                        "bounds", [round(v) for v in g.bounds])
              near = L.coast_tree.query(q.buffer(5000))
              print("  coast pieces within 5 km (envelope)", len(near), "min dist %s" % (min((L.coast_tree.geometries[i].distance(q) for i in near), default=None)))
              print("  dwithin 600", list(L.coast_tree.query(q, predicate="dwithin", distance=600))[:5])
          PY

      - name: Publish to branch probe-log
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d="$(mktemp -d)"; cp -r /tmp/p/. "$d/" || echo none > "$d/probe.md"
          cd "$d"; git init -q -b probe-log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe ${GITHUB_RUN_ID}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --force origin probe-log
