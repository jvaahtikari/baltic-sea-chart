name: Probe seamark sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y -qq --no-install-recommends osmium-tool gdal-bin python3-gdal python3-numpy python3-shapely python3-pyproj
      - name: Which Latvian lights does the build's land test drop, and why (real land polygons and OSM data)
        timeout-minutes: 25
        run: |
          mkdir -p /tmp/p /tmp/pw/raw/land /tmp/pw/raw/osm
          BSC_WORK=/tmp/pw python3 - <<'PY' > /tmp/p/probe.md 2>&1 || true
          import json, subprocess
          from pipeline import config as C, fetch as F
          d = C.RAW / "land"
          z = d / "land.zip"
          F.http_get(C.OSMDATA + "land-polygons-complete-4326.zip", z, timeout=1800)
          subprocess.run(["ogr2ogr", "-f", "GeoJSONSeq", "-overwrite", str(d / "land.geojsonl"),
                          "/vsizip/%s/land-polygons-complete-4326/land_polygons.shp" % z,
                          "-clipsrc", "20.5", "56.0", "25.0", "58.2", "-explodecollections", "-lco", "RS=NO"], check=True)
          F.osm_region_from_extract("latvia", C.GEOFABRIK + "europe/latvia-latest.osm.pbf", C.RAW / "osm")
          from pipeline import build as B
          from shapely.geometry import shape, Point
          import shapely
          L = B.LandIndex()
          print("| name | type | geom | keep | m to coast |")
          print("| --- | --- | --- | --- | ---: |")
          for line in open(C.RAW / "osm" / "latvia.geojsonl"):
              ft = json.loads(line)
              p = ft["properties"]
              lit = B.osm_lights(p)[0]
              if not lit or not (p.get("man_made") == "lighthouse" or (B.osm_range(p) or 0) >= 10):
                  continue
              g = shape(ft["geometry"])
              pt = g if g.geom_type == "Point" else g.representative_point()
              x, y = B._to_laea.transform(pt.x, pt.y)
              q = Point(x, y)
              on_land = len(L.land_tree.query(q, predicate="intersects")) > 0
              dist = min((L.coast_tree.geometries[i].distance(q) for i in L.coast_tree.query(q.buffer(20000))), default=-1)
              print("| %s | %s | %s | %s | %d |" % (p.get("name") or p.get("seamark:name"), p.get("seamark:type"), g.geom_type,
                                                   L.keep(pt.x, pt.y), dist if on_land else 0))
          PY

      - name: Publish to branch probe-log
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d="$(mktemp -d)"; cp -r /tmp/p/. "$d/" || echo none > "$d/probe.md"
          cd "$d"; git init -q -b probe-log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "probe ${GITHUB_RUN_ID}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --force origin probe-log
